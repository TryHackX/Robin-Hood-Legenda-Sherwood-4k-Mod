; ============================================================================
; SherwoodEngineFix - plik konfiguracyjny
; Gra: Robin Hood: Legenda Sherwood (2002, Spellbound Entertainment - GOG)
; Opis zmian i wynikow testow: docs\PLAN.md
; ============================================================================

[Display]
; Rozdzielczosc, w jakiej gra rysuje obraz (rozdzielczosc wewnetrzna). Obraz jest potem skalowany
; do rozdzielczosci monitora. W menu Opcje -> Grafika sa 3 przyciski: 1920*1080, 2560*1440, 3840*2160
; (albo wartosc wpisana tutaj, jesli jest inna).
;   2560x1440 = TRYB HD (domyslnie): gra sklada obraz w pelnej rozdzielczosci monitora, a mapa
;               jest pokazywana w powiekszeniu 2,0 (HDView=1) - kadr jak przy 1280x720, ale interfejs, napisy
;               i kursor sa ostre, a tlo mapy pochodzi z wersji HD (HDBackgrounds=1, folder hd\maps).
;   1280x720  = caly obraz gry rozciagany x2 do monitora 1440p (wszystko "duze", ale rozmyte/klockowate)
;   1152x648  = jak 1280x720, ale oddalanie widoku dziala tez w Nottingham; skalowanie x2,22
;   0 x 0     = rozdzielczosc monitora
Width=2560
Height=1440
Replace1024x768=1

; ---- TRYB HD (dziala, gdy Width >= 2048) -----------------------------------------------------------
; HDView=1: kazda misja startuje w powiekszeniu 2,0 (kadr jak na ekranie 1280x720). Oddalanie klawiszem
; gry (Num -) dziala tam, gdzie mapa jest wystarczajaco duza (Leicester, Lincoln, York); przyblizanie Num +.
HDView=1

; FullHeightView=1: mapa jest rysowana do samego dolu ekranu; elementy interfejsu (portret, przyciski)
; leza na niej w rogach. 0 = oryginalny czarny pas 80 px na dole.
FullHeightView=1

; HDBackgrounds=1: tlo mapy w powiekszeniu 2,0 pochodzi z obrazow HD (hd\maps\<wariant>\*.hdmap),
; przygotowanych modelami AI z oryginalnych map (tools\hd\upscale_variants.py). Kolory i jasnosc sa
; dopasowane do oryginalu; z AI pochodza tylko szczegoly. 0 = oryginalne piksele x2.
HDBackgrounds=1

; Wariant tla HD pokazywany po starcie = nazwa folderu w hd\maps:
;   dat2       - najwierniejszy oryginalowi, najostrzejsze szczegoly (model DAT2)
;   sgi        - model uczony na prerenderowanej grafice gier z lat 90./2000.
;   ultrasharp - dodaje najwiecej "wymyslonych" detali i ostrosci
;   aomr       - model do tekstur gier (Age of Mythology Retold), kontrastowy
;   off        - bez tla HD (oryginalne piksele)
; PRZELACZANIE W TRAKCIE GRY (wybor jest zapamietywany w tej linii):
;   F8 = oryginal <-> HD (szybkie porownanie "przed / po")
;   F7 = nastepny wariant, F6 = poprzedni wariant
; Na gorze ekranu przez 3 s pojawia sie nazwa wlaczonego wariantu.
HDVariant=dat2

; Klawisze przelaczania - kody klawiszy Windows, DZIESIETNIE (F5=116 ... F12=123; 0 = brak).
; F1 i F5 sa zajete przez gre (szybki zapis / odczyt).
HDKeyToggle=119
HDKeyNext=118
HDKeyPrev=117

; HDWater=1: na tle HD nie sa rysowane animacje wody z gry (sa w niskiej rozdzielczosci i mocno
; skompresowane - na tle HD wygladaly jak mozaika). Woda jest wtedy nieruchoma, z obrazu HD.
; 0 = animacja wody jak w oryginale.
HDWater=1

; HDSprites=1: postacie, dachy, drzewa i inne obiekty sa w powiekszeniu 2,0 rysowane z wersji HD
; (hd\sprites\<wariant>\ - dachy i obiekty w stylu wybranego wariantu tla; hd\sprites\_common\ -
; postacie i animacje, wspolne dla wszystkich wariantow). Klatka, ktorej nie ma w wersji HD, jest
; rysowana jak dotad. Z wariantem "off" (F8) wylaczone razem z tlem. 0 = nigdy.
; Ikony i znaczniki (portret nad bohaterem, "Z" nad spiacym, pierscien pod postacia) tez sa w HD:
; hd\sprites\_icons\. Ikony z misji, w ktorych jeszcze nie byly dorobione, mod zapisuje do
; hd\work\runtime_frames\ - dorabia je:  python tools/hd/upscale_icons.py --model ultrasharp
HDSprites=1

; HDInBetween=1: klatki posrednie animacji postaci, wygenerowane przez AI (model RIFE), od 2026-11-14 dla
; WSZYSTKICH postaci (hd\sprites\_between\, ok. 3 GB). Gra zmienia klatke animacji co 40 ms; z ta opcja w polowie
; tego czasu pokazywana jest klatka "w pol drogi" miedzy stara a nowa, czyli animacja idzie 2x plynniej.
; Przejscia, ktore nie przeszly kontroli jakosci (ok. 31 %), ida jak w oryginale. Klatki posrednie sa odrobine
; mieksze od oryginalnych. Przelaczanie w trakcie gry: F9 (wybor jest zapamietywany w tej linii).
; 0 = wylaczone; usuniecie folderu hd\sprites\_between wylacza je calkiem.
HDInBetween=1
; Klawisz przelaczania klatek posrednich (kod dziesietny, 120 = F9; 0 = brak).
HDKeyBetween=120

; UIScale=2: interfejs w misji 2x wiekszy (od 2026-11-14) - narozniki HUD, portrety, przyciski,
; minimapa, dymki z podpowiedziami, napis z pieniedzmi, komunikaty i kursor myszy. Kazde okno rosnie
; od swojego rogu ekranu (okno na srodku - wokol wlasnego srodka), klikniecia trafiaja tam, gdzie
; je widac. Dziala przy szerokosci obrazu od 2048. 0 = rozmiar oryginalny (maly przy 2560x1440).
UIScale=2
; MapPosition: gdzie otwiera sie minimapa przy UIScale=2:
;   1 = prawy gorny rog, pod przyciskiem mapy (nie zaslania srodka ekranu)
;   0 = tam, gdzie otwiera ja gra (u gory, prawie na srodku)
MapPosition=1
; MapDragCamera=1: przeciaganie lewym przyciskiem po obrazku otwartej minimapy przesuwa kamere (jak w
; strategiach), a samo okno mapy przesuwa sie za jego brzegi - lewym albo prawym przyciskiem; okno idzie
; za kursorem plynnie. Prawy klik na mapie nadal ja zamyka. 0 = jak w grze (przeciaganie przesuwa okno).
; Dziala przy kazdej skali interfejsu. Tez w panelu F10.
MapDragCamera=1

; SmoothZoom=1: plynny zoom ("lupa", w trybie HD). Klawisze zoomu gry, kolko myszy i przyciski w rogu
; zmieniaja przyblizenie malymi krokami: od "caly poziom wypelnia ekran" (bez czarnego pasa) do ZoomMax.
; Silnik gry rysuje w powiekszeniu 1,0 albo 2,0 (grafika HD), reszte powieksza karta graficzna - tylko
; swiat, interfejs zostaje w swojej wielkosci. Klikniecia trafiaja tam, gdzie je widac. Przy brzegu mapy
; widok dojezdza do samej krawedzi. 0 = tylko dwa poziomy gry (1,0 i 2,0). Tez w panelu F10.
SmoothZoom=1
; ZoomStep: jeden krok zoomu w procentach (110 = drobny, 115 = domyslny, 200 = skok jak w grze).
ZoomStep=115
; ZoomMax: najwieksze przyblizenie w procentach (200 = 2,0 gry, 400 = jeszcze dwa razy blizej).
ZoomMax=400

; MenuZoom=1: menu glowne i okna gry (odprawa, menu Esc w misji, wczytywanie/zapis, opcje) sa
; ulozone dla ekranu 1024x768 i przy 2560x1440 bylyby male na srodku. Z ta opcja widac na calym
; ekranie srodkowa czesc obrazu (768 linii, ok. 1,9x wieksza); kursor zostaje w tej czesci i
; porusza sie po ekranie z ta sama predkoscia. Tylko z Renderer=1 i Presenter=0. 0 = wylaczone.
MenuZoom=1

; HDMenu=1: przy MenuZoom=1 tla menu (menu glowne, opcje, wczytywanie...) sa pokazywane w wersji HD,
; powiekszonej modelem AI wybranego wariantu tla (hd\menu\<wariant>\, robi je tools\hd\upscale_menu.py
; z obrazkow, ktore mod sam zbiera do hd\work\menu_frames\). Napisy, przyciski i kursor zostaja z gry.
; 0 = tla menu jak w oryginale (tylko powiekszone).
HDMenu=1

; SettingsKey: klawisz panelu ustawien moda w grze (kod dziesietny, 121 = F10; 0 = bez panelu).
; Panel dziala w menu, w oknach gry i w misji: zmienia najwazniejsze opcje (grafika HD, interfejs,
; minimapa, menu, VSync, filtr, licznik FPS, predkosc kursora) od razu i zapisuje je w tym pliku.
; Klik lub strzalki zmieniaja wartosc, F10 albo Esc zamyka. W misji gra sie nie zatrzymuje
; (pauza: najpierw Esc, potem F10).
SettingsKey=121

; SmoothSprites=1: obiekty bez wersji HD sa w powiekszeniu 2,0 powiekszane z wygladzaniem zamiast
; klockami 2x2 (cienie przyciemniaja kazdy piksel tla HD osobno). 0 = klocki jak w oryginale.
SmoothSprites=1

; Okno bez ramek na caly ekran (gra nie zmienia trybu ekranu; Alt+Tab dziala jak w zwyklym programie)
WindowedBorderless=1

; Synchronizacja pionowa z odswiezaniem monitora (zwykly VSync, dziala z kazda czestotliwoscia).
; 1 = jedna klatka na odswiezenie: rowne tempo, brak rozrywania obrazu. 0 = bez synchronizacji.
VSync=1

; Limit klatek w menu glownym (w rozgrywce tempo wyznacza VSync albo FramesPerTick)
MaxFPS=120

; Silnik wyswietlania:
;   1 = wlasny DirectDraw w pamieci + Direct3D 11 (szybki; wrapper GOG-a jest pomijany)
;   0 = stary tryb przez wrapper GOG-a (ddraw.dll + dxcfg.ini) - wolny, tylko awaryjnie
Renderer=1

; Filtr skalowania do rozdzielczosci monitora (dla Renderer=1):
;   0 = najblizszy sasiad (ostre piksele), 1 = sharp-bilinear (ostre, bez migotania), 2 = bilinear (miekkie)
ShaderFilter=1

; Przy VSync=0: 1 = pokazuj klatke natychmiast, nawet kosztem rozrywania obrazu (najmniejsze opoznienie)
AllowTearing=0

; Awaryjnie: 1 = prezentacja przez GDI zamiast Direct3D 11
Presenter=0

; Zachowanie proporcji obrazu przy skalowaniu (1 = tak, 0 = rozciagnij do ekranu)
FixAspectRatio=1

[Performance]
; Zegar systemowy o rozdzielczosci 1 ms (dokladne odmierzanie tickow gry)
HighResolutionTimer=1

; KLATKI POSREDNIE: gra liczy logike 25 razy na sekunde i tyle samo razy rysowala obraz. Mod wola
; wlasna funkcje rysujaca gry dodatkowo miedzy tickami - po jednej klatce na odswiezenie monitora.
; Logika dalej idzie 25 Hz, wiec predkosc gry sie nie zmienia.
;
; Plynne przesuwanie mapy: kazda klatka przesuwa kamere o czesc dystansu odpowiadajaca uplywowi czasu.
SmoothCameraScroll=1

; Plynny kursor: klatka jest odswiezana miedzy tickami takze wtedy, gdy mapa stoi.
SmoothCursor=1

; Plynny ruch postaci, zwierzat, wozow i pociskow: w klatkach posrednich obiekty sa rysowane
; w polozeniu miedzy poprzednim a biezacym tickiem (pokazywane do 40 ms za pozycja logiczna).
; Sama animacja krokow zostaje jak w oryginale. Wymaga wlaczonych klatek posrednich.
SmoothMotion=1

; Tylko przy VSync=0: ile klatek na jeden tick gry (40 ms). 0 = tyle, ile odswiezen monitora.
FramesPerTick=0

; Przypinanie watkow gry do stalych rdzeni CPU. Wylaczone: przypiety watek nie moze uciec na wolny
; rdzen, gdy jego rdzen zajmie inny program - w pomiarach dawalo to okresowe 2-3x spowolnienia.
ThreadOptimization=0

; Opcje z wczesniejszych wersji, bez zmierzonego zysku (zostawione do porownan):
;   OptimizeFogOfWar - czyszczenie bufora mgly wojny instrukcjami SSE2
;   UseSSE2Blit      - podmiana memcpy w kodzie gry na wersje SSE2
;   ForceSystemMemorySurfaces - dziala tylko przy Renderer=0
OptimizeFogOfWar=1
UseSSE2Blit=1
ForceSystemMemorySurfaces=1

[Input]
; Predkosc przesuwania mapy w procentach. 0 = automatycznie wg rozdzielczosci (szerokosc / 1024),
; bo predkosci gry byly dobrane pod ekrany 640-1024 px i na 2560 px mapa sunie za wolno. 100 = oryginal.
EdgeScrollSpeed=0

; Maksymalna liczba raportow ruchu myszy na sekunde przekazywana do gry. Gra wykonuje jeden przebieg
; obslugi wejscia na kazdy raport myszy; zmierzony koszt jest pomijalny (0,01 ms), wiec to tylko
; zabezpieczenie dla myszy 4000-8000 Hz. Klikniecia nie sa opozniane. 0 = bez limitu.
MouseReportRateHz=125

; Predkosc kursora w procentach. 0 = automatycznie: rozdzielczosc wewnetrzna / rozdzielczosc okna, czyli
; kursor pokonuje na ekranie te sama droge niezaleznie od Width/Height (przy 1280x720 na 1440p = 50).
; 100 = oryginal (jeden impuls myszy = jeden piksel gry). Dziala tylko, gdy MouseReportRateHz > 0.
MouseSensitivity=0

; Nieuzywane (zostawione dla zgodnosci ze starszym plikiem):
RawMouseInput=1
LockCursorToWindow=1

[Audio]
; Minimalny bufor miksowania FMOD w ms (0 = zostaw ustawienie gry). Podnies np. do 100, gdy dzwiek trzeszczy.
BufferMs=0

; Zasieg slyszalnosci dzwiekow na mapie w procentach. 0 = automatycznie wg rozdzielczosci.
; Oryginalnie dzwiek cichnie do zera 800 px od srodka widoku - na 2560x1440 to tylko srodek ekranu,
; wiec walki blizej krawedzi byly nieme. 100 = oryginal.
HearingRangePercent=0

[Debug]
; Zapisywanie logow diagnostycznych do pliku SherwoodFix.log
EnableLogging=1

; Licznik klatek na sekunde i rozdzielczosc wewnetrzna w lewym gornym rogu
ShowFPSOverlay=0

; Linie Perf(5s)/Blit(5s)/Input(5s)/Spike w logu: na co schodzi czas ticka
PerfLog=1

; Profiler probkujacy glowny watek gry (1 kHz) - linie Prof.* w logu. Tylko do diagnozy wydajnosci;
; na co dzien wylaczony (wstrzymuje glowny watek 1000 razy na sekunde).
Profiler=0

; Straznik zwiech: gdy okno gry jest na wierzchu, a gra przez 3 s nie narysuje klatki ani nie obsluzy
; komunikatu, do logu trafia miejsce, w ktorym stoi glowny watek. Pilnuje tez zamykania: jesli proces
; nie zniknie w 2 s po zamknieciu okna gry, zostaje zakonczony (koniec "Game.exe bez okna" w tle).
; Przywraca tez grze stan "aktywna", gdy jej okno jest na wierzchu, a gra uwaza inaczej i stoi.
HangWatchdog=1
